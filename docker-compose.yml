version: '3.8'

services:
  # Redis - Message broker for Celery
  redis:
    image: redis:7-alpine
    container_name: dubbing-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  # FastAPI Backend
  backend:
    build:
      context: ./dubbing-backend
      dockerfile: Dockerfile
    container_name: dubbing-backend
    ports:
      - "8000:8000"
    volumes:
      - ./dubbing-backend/app:/app/app
      - ./dubbing-backend/src:/app/src
      - ./dubbing-backend/output:/app/output
      - ./dubbing-backend/temp:/app/temp
      - ./dubbing-backend/bin:/app/bin
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  # Celery Worker
  worker:
    build:
      context: ./dubbing-backend
      dockerfile: Dockerfile
    container_name: dubbing-worker
    command: celery -A app.tasks:celery_app worker --loglevel=info --concurrency=2
    volumes:
      - ./dubbing-backend/app:/app/app
      - ./dubbing-backend/src:/app/src
      - ./dubbing-backend/output:/app/output
      - ./dubbing-backend/temp:/app/temp
      - ./dubbing-backend/bin:/app/bin
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: ./dubbing-frontend
      dockerfile: Dockerfile
    container_name: dubbing-frontend
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: dubbing-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dubbing-backend/output:/usr/share/nginx/html/output:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  redis_data:
